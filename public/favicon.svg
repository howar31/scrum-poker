<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Ghost card behind for a stacked-cards feel -->
  <g transform="rotate(14 24 24) translate(4 -1)" opacity="0.5">
    <rect x="12" y="7" width="24" height="32" rx="3" fill="url(#ghostGrad)"/>
  </g>

  <!-- Main card, tilted -->
  <g transform="rotate(-8 24 24)">
    <rect x="10" y="6" width="28" height="36" rx="3.5" fill="url(#cardGrad)"/>
    <!-- Inner highlight stroke for a subtle "edge" -->
    <rect x="10" y="6" width="28" height="36" rx="3.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
    <!-- Center "5" -->
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="white" text-anchor="middle">5</text>
  </g>
</svg>
